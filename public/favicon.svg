<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff" rx="8"/>
  
  <!-- Book -->
  <path d="M 50 60 Q 50 50 60 50 L 140 50 Q 150 50 150 60 L 150 140 Q 150 150 140 150 L 60 150 Q 50 150 50 140 Z" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Book pages -->
  <path d="M 100 50 L 100 150" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Left page lines -->
  <line x1="65" y1="70" x2="95" y2="70" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="85" x2="95" y2="85" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="100" x2="95" y2="100" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right page elements -->
  <!-- AI Star -->
  <circle cx="120" cy="65" r="15" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="72" font-size="16" font-weight="bold" text-anchor="middle" fill="#22c55e" font-family="Arial">AI</text>
  
  <!-- Network nodes -->
  <circle cx="110" cy="100" r="3" fill="#1e3a8a"/>
  <circle cx="130" cy="95" r="3" fill="#1e3a8a"/>
  <circle cx="135" cy="115" r="3" fill="#1e3a8a"/>
  <circle cx="115" cy="125" r="3" fill="#1e3a8a"/>
  
  <!-- Network lines -->
  <line x1="110" y1="100" x2="130" y2="95" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="110" y1="100" x2="135" y2="115" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="130" y1="95" x2="135" y2="115" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="135" y1="115" x2="115" y2="125" stroke="#1e3a8a" stroke-width="1.5"/>
</svg>